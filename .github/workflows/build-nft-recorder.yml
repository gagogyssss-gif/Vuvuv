name: Build NFT Recorder APK

on:
  push:
    branches: [nft-recorder]
    paths:
      - 'NFTRecorderProject.zip'
      - 'patches/**'
      - '.github/workflows/build-nft-recorder.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Unpack and patch v6
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q NFTRecorderProject.zip -d buildsrc
          cd buildsrc
          patch -p0 < ../patches/H264LottieRenderer-v2.patch
          patch -p0 < ../patches/MainActivity-v2.patch
          python ../patches/apply-v3.py
          python ../patches/apply-v4-zoom.py
          python ../patches/apply-v5-telegram-links.py
          python ../patches/apply-v6-batch-import.py
          echo "android.useAndroidX=true" > NFTRecorderProject/nft-recorder/gradle.properties
          sed -i "s/versionCode 1/versionCode 6/; s/versionCode 2/versionCode 6/; s/versionName '0.1.0'/versionName '0.4.0'/; s/versionName '0.2.0'/versionName '0.4.0'/" NFTRecorderProject/nft-recorder/app/build.gradle

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle -p buildsrc/NFTRecorderProject/nft-recorder :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NFT-Recorder-v6-BatchImportAutoCrop
          path: buildsrc/NFTRecorderProject/nft-recorder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
