name: Build NFT Recorder v7 APK

on:
  push:
    branches: [nft-recorder]
    paths:
      - 'v7/**'
      - '.github/workflows/build-nft-recorder.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild v7 project archive
        shell: bash
        run: |
          cat             v7/project.b64.00             v7/project.b64.01             v7/project.b64.02             v7/project.b64.030             v7/project.b64.031             v7/project.b64.040             v7/project.b64.041 > /tmp/nft-v7.b64
          base64 -d /tmp/nft-v7.b64 > /tmp/NFTRecorderProject-v7.zip
          unzip -t /tmp/NFTRecorderProject-v7.zip
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q /tmp/NFTRecorderProject-v7.zip -d buildsrc

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build v7 APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle -p buildsrc/NFTRecorderProject/nft-recorder :app:assembleDebug --stacktrace

      - name: Upload v7 APK
        uses: actions/upload-artifact@v4
        with:
          name: NFT-Recorder-v7
          path: buildsrc/NFTRecorderProject/nft-recorder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
