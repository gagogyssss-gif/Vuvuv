name: Build NFT Recorder v8 APK

on:
  push:
    branches: [nft-recorder]
    paths:
      - 'v8/**'
      - '.github/workflows/build-nft-recorder.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct v8 project
        shell: bash
        run: |
          rm -rf buildsrc
          mkdir -p buildsrc
          cat v8/project.b64.* > /tmp/nft-v8.b64
          base64 -d /tmp/nft-v8.b64 > /tmp/NFTRecorderProject-v8.zip
          unzip -q /tmp/NFTRecorderProject-v8.zip -d buildsrc
          test -f buildsrc/NFTRecorderProject/nft-recorder/app/build.gradle
          grep -q "versionCode 8" buildsrc/NFTRecorderProject/nft-recorder/app/build.gradle

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle -p buildsrc/NFTRecorderProject/nft-recorder :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NFT-Recorder-v8-FrameFix
          path: buildsrc/NFTRecorderProject/nft-recorder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
